<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>{{ template_data.title }}</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="base-header">
        <div class="base-header-content-wrapper">
            <div class="base-header-content">
                <div class="base-header-left">
                    <button>+ Contact</button>
                </div>
                <div class="base-header-center">
                    <a href="{% url 'core.index' %}"><h1>AVALANCHE</h1></a>
                </div>
                <div class="base-header-right">
                    <ul>
                        <li><a href=""><img src="{% static 'icons/ic--outline-shopping-bag.svg' %}" alt=""></a></li>
                        <li><button><img src="{% static 'icons/line-md--account.svg' %}" alt=""></button></li>
                        <li><button><img src="{% static 'icons/mynaui--search.svg' %}" alt=""></button></li>
                        <li><button id="menuBtn"><img src="{% static 'icons/system-uicons--menu-hamburger.svg' %}" alt=""> <span>Menu</span></button></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>
    <div class="pad"></div>
    <main>
        {% block content %}
        {% endblock %}
    </main>
    <footer class="base-footer">
        <div class="footer-top">
            <div class="footer-top-section">
                <h2>SITE LINKS</h2>
                <ul>
                    <li><a href="{% url 'core.index' %}">Home</a></li>
                    <li><a href="">Dashboard</a></li>
                    <li><a href="">Cart</a></li>
                </ul>
            </div>
            <div class="footer-top-section useful-links">
                <h2>USEFUL LINKS</h2>
                <ul>
                    <li><a href="{% url 'core.category_detail' brand_slug='avalanche' category_slug='hoodie' %}">Hoodies</a></li>
                    <li><a href="{% url 'core.category_detail' brand_slug='avalanche' category_slug='joggers' %}">Joggers</a></li>
                    <li><a href="{% url 'core.category_detail' brand_slug='avalanche' category_slug='shirts' %}">Shirts</a></li>
                    <li><a href="{% url 'core.category_detail' brand_slug='avalanche' category_slug='jeans' %}">Jeans</a></li>
                    <li><a href="{% url 'core.category_detail' brand_slug='avalanche' category_slug='bags' %}">Bags</a></li>
                    <li><a href="{% url 'core.category_detail' brand_slug='avalanche' category_slug='shoes' %}">Shoes</a></li>
                </ul>
            </div>
            <div class="footer-top-section social-links">
                <h2>SOCIALS</h2>
                <ul>
                    <li><a href="https://wa.me/9139053984?text=I%20would%20like%20to%20know%20more%20about%20your%20products"><img src="{% static 'icons/ic--baseline-whatsapp.svg' %}" alt=""></a></li>
                    <li><a href="https://www.instagram.com/avalanche_luxe1?utm_source=qr"><img src="{% static 'icons/line-md--instagram.svg' %}" alt=""></a></li>
                    <li><a href="https://www.tiktok.com/@avalanche_luxe?_r=1&_t=ZS-96Z9PC9ql0L"><img src="{% static 'icons/line-md--tiktok.svg' %}" alt=""></a></li>
                    <li><a href="https://x.com/avalanche_luxe?s=11"><img src="{% static 'icons/line-md--twitter-x.svg' %}" alt=""></a></li>
                    <li><a href="https://www.facebook.com/share/18jDCvFEpW/?mibextid=wwXIfr"><img src="{% static 'icons/mingcute--facebook-fill.svg' %}" alt=""></a></li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            <h1>AVALANCHE</h1>
            <div class="base-legal">
                <p>All rights reserved.</p>
                <p><span>AVALANCHE</span> <p id="currentYear"></p></p>
            </div>
        </div>
    </footer>
    <script>
        function getYear() {
            const yearEle = document.getElementById('currentYear')
            yearEle.textContent = `${new Date().getDate()}/${new Date().getMonth() + 1}/${new Date().getFullYear()}.`
        }
        getYear()
    </script>
</body>
</html>
